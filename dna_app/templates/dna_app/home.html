<!DOCTYPE html>
<html>

<head>
    <title>DNA Analyzer</title>
    <style>
        body {
            font-family: Arial;
            background: #0a0a0a;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px
        }

        .card {
            background: #111;
            border: 1px solid #1a3a2a;
            border-radius: 12px;
            padding: 30px;
            width: 500px
        }

        .error {
            background: #1a0808;
            border: 1px solid red;
            color: #ff8080;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px
        }

        textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #1a3a2a;
            color: #00ff88;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 8px;
            outline: none
        }

        button {
            width: 100%;
            margin-top: 12px;
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer
        }

        a {
            margin-top: 15px;
            color: #888
        }
    </style>
</head>

<body>
    <h1>🧬 DNA Analyzer</h1>
    <div class="card">
        {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <textarea name="dna" rows="3" placeholder="ATCGGCTA">{{ dna }}</textarea>
            <button type="submit">Analyze →</button>
        </form>
    </div>
    <a href="{% url 'history' %}">View History →</a>
</body>

</html>
